name: Security & Audit Check

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies, run TypeScript checks and audit
        run: npm ci && npx tsc --noEmit && npm audit --omit=dev --audit-level=critical

